name: Vitest Run with Prisma and Bun

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # ここに定義することで env("DATABASE_URL") がエラーにならなくなります
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/test_db"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pg_bigm in CI
        run: |
          docker exec -u root ${{ job.services.postgres.id }} bash -lc "apt-get update && apt-get install -y git build-essential postgresql-server-dev-15"
          docker exec -u root ${{ job.services.postgres.id }} bash -lc "rm -rf /tmp/pg_bigm && git clone --depth=1 https://github.com/pgbigm/pg_bigm.git /tmp/pg_bigm"
          docker exec -u root ${{ job.services.postgres.id }} bash -lc "cd /tmp/pg_bigm && make USE_PGXS=1 && make USE_PGXS=1 install"
          docker exec ${{ job.services.postgres.id }} psql -U user -d test_db -c "CREATE EXTENSION IF NOT EXISTS pg_bigm;"

          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # これで env("DATABASE_URL") が値を拾えるようになり、エラーが消えます
      - name: Generate Prisma Client
        run: bun x prisma generate

      - name: Apply Prisma Migrations
        run: bun x prisma migrate deploy

      - name: Run Vitest
        run: bun x vitest run
